name: CI
on:
  pull_request:
  push:
    branches-ignore: [main, master]
jobs:
  swift:
    runs-on: macos-26 # Xcode 26: Swift 6.2, the floor swift-tools-version:6.2 sets
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Serial: the parallel swift-testing run occasionally freezes a few ms in (no thread blocked; seen before the
      # Swift 6 migration too). Serial runs have never frozen and take about 3 s.
      - run: swift test --no-parallel
      - run: swift build -c release
  local-openlive:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.22.3, cache: pnpm, cache-dependency-path: local-openlive/pnpm-lock.yaml }
      - run: ./scripts/local-openlive-source
      - run: pnpm install --frozen-lockfile
        working-directory: local-openlive
      - run: pnpm build # syncs the pinned OpenLive source into vendor/, which check and test import
        working-directory: local-openlive
      - run: pnpm check
        working-directory: local-openlive
      - run: pnpm test
        working-directory: local-openlive
